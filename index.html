<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>С днём рождения, Луна</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: #120a18;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
  }

  .screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    width: 100%;
  }
  .screen[hidden] { display: none !important; }

  /* --- Экран 1 --- */
  .hello {
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #a98ac0;
    margin-bottom: 24px;
  }

  .big-btn {
    font-size: 1.1rem;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, #ff4d94, #b04dff);
    border: none;
    border-radius: 50px;
    padding: 18px 45px;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(255, 77, 148, 0.4);
    transition: transform 0.1s;
  }
  .big-btn:active { transform: scale(0.95); }

  /* --- Экран 2 --- */
  .heart-stage {
    position: relative;
    width: min(85vw, 400px);
    height: min(85vw, 400px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* SVG сердце на фоне */
  .heart-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    animation: pulse 2.5s ease-in-out infinite;
  }

  /* Пульсация всего сердца */
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.05); opacity: 1; }
  }

  .heart-path {
    fill: none;
    stroke: #ff4d94;
    stroke-width: 0.8;
    filter: drop-shadow(0 0 10px rgba(255, 77, 148, 0.6));
  }

  /* Текст строго по центру */
  .heart-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 70%;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }

  .heart-text .title {
    font-size: 20px;
    font-weight: 800;
    line-height: 1.2;
    color: #fff;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
  }
  .heart-text .age {
    font-size: 14px;
    font-weight: 500;
    color: #ff9ecb;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
  }
  .heart-text .wish {
    font-size: 11px;
    line-height: 1.4;
    color: #e6daf0;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    margin-top: 4px;
  }

  .back {
    position: absolute;
    bottom: 30px;
    font-size: 13px;
    color: #a98ac0;
    background: transparent;
    border: none;
    text-decoration: underline;
    padding: 10px;
    cursor: pointer;
    z-index: 20;
  }
</style>
</head>
<body>

<div class="screen" id="screen1">
  <div class="hello">У тебя письмо</div>
  <button class="big-btn" id="startBtn">Открыть 💌</button>
</div>

<div class="screen" id="screen2" hidden>
  <div class="heart-stage">
    <!-- Векторное сердце (оно внутри пустое) -->
    <svg class="heart-svg" viewBox="0 0 100 100">
      <path class="heart-path" d="M50 85 C 15 60, 0 35, 10 15 C 20 0, 40 0, 50 15 C 60 0, 80 0, 90 15 C 100 35, 85 60, 50 85 Z" />
    </svg>
    
    <!-- Текст внутри -->
    <div class="heart-text">
      <div class="title">С днём рождения,<br>Луна</div>
      <div class="age">Тебе сегодня 16 лет</div>
      <div class="wish">Желаю тебе всего наилучшего.<br>Будь самой красивой</div>
    </div>
  </div>
  <button class="back" id="backBtn">← Назад</button>
</div>

<script>
  const s1 = document.getElementById('screen1');
  const s2 = document.getElementById('screen2');

  document.getElementById('startBtn').addEventListener('click', () => {
    s1.hidden = true;
    s2.hidden = false;
  });
  document.getElementById('backBtn').addEventListener('click', () => {
    s2.hidden = true;
    s1.hidden = false;
  });
</script>
</body>
</html>
